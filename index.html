<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ステンドグラス</title>
<!-- ===== PWA設定 ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14110e">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<!-- iOS: ホーム画面追加用 -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ステンドグラス">
<script src="./core.js"></script>
<style>
  /* ===== 全体:大正の洋館の薄暗がり ===== */
  :root {
    --ink: 215,200,170;        /* 文字 */
    --ink-soft: 215,200,170;
    --accent: 255,225,160;     /* 選ばれている所 */
    --panel: 20,16,12;         /* 札の下地 */
    --bar-fade: 10,8,6;        /* 操作帯のぼかし */
    --wall: #14110e;           /* 壁 */
    --start-bg: none;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--wall);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  canvas { display: block; }

  /* ===== タイトル画面 ===== */
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--start-bg);
    z-index: 5;
    transition: opacity 0.45s ease;
  }
  #start[hidden] { display: none; }   /* ID 指定は [hidden] より強いので、必ず書く */
  #start.fading { opacity: 0; pointer-events: none; }

  #start-icon {
    width: min(46vw, 190px); height: auto;
    border-radius: 22%;
    box-shadow: 0 0 44px rgba(var(--accent),0.22), 0 10px 30px rgba(0,0,0,0.22);
  }
  #start-sub {
    color: rgba(var(--ink),0.78);
    font-size: 13px; letter-spacing: 0.28em;
  }
  #start-tools { display: flex; gap: 8px; }
  #start-tools .btn {
    font-size: 11px; letter-spacing: 0.12em;
    padding: 7px 14px; opacity: 0.85;
  }
  #start-menu {
    display: flex; flex-direction: column; gap: 9px;
    width: min(86vw, 280px);
  }
  .start-btn {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    width: 100%; min-height: 48px;
    padding: 11px 16px;
    color: rgba(var(--ink),0.92);
    background: rgba(var(--panel),0.72);
    border: 1px solid rgba(var(--ink),0.3);
    border-radius: 5px;
    font-family: inherit; font-size: 15px; letter-spacing: 0.16em;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .start-btn:active { background: rgba(var(--ink),0.16); }
  .start-btn .note {
    font-size: 11px; letter-spacing: 0.1em;
    color: rgba(var(--ink-soft),0.62);
  }
  #go-resume {
    border-color: rgba(var(--accent),0.75);
    color: rgba(var(--accent),1);
    background: rgba(var(--accent),0.10);
  }
  #go-resume[hidden] { display: none; }

  /* 段を5つに増やしたので、背の低い画面では詰める。
     iPhone SE (568px) で「つづきから」も出ると、そのままでは
     いちばん下の very hard が画面の外へ出てしまう */
  @media (max-height: 700px) {
    #start { gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); }
    #start-icon { width: min(30vw, 118px); }
    #start-sub { font-size: 12px; letter-spacing: 0.2em; }
    #start-tools .btn { padding: 5px 12px; }
    #start-menu { gap: 6px; }
    .start-btn { min-height: 42px; padding: 8px 14px; font-size: 14px; }
  }

  /* ===== 棚に何か増えた時のお知らせ ===== */
  #unlock {
    position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
    max-width: 84vw; text-align: center;
    padding: 8px 16px;
    color: rgba(var(--ink),0.95);
    background: rgba(var(--panel),0.92);
    border: 1px solid rgba(var(--accent),0.55);
    border-radius: 4px;
    font-size: 12.5px; letter-spacing: 0.14em; line-height: 1.5;
    box-shadow: 0 0 22px rgba(var(--accent),0.22);
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 6;
  }
  #unlock.show { opacity: 1; }

  /* ===== 硝子棚 ===== */
  #shelf {
    position: fixed; inset: 0; z-index: 7;
    display: flex; flex-direction: column;
    background: var(--start-bg);
    padding: calc(14px + env(safe-area-inset-top)) 16px
             calc(14px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  #shelf[hidden] { display: none; }
  #shelf h2 {
    margin: 2px 0 2px; text-align: center;
    color: rgba(var(--ink),0.92);
    font-size: 15px; font-weight: normal; letter-spacing: 0.4em;
  }
  #shelf .tally {
    text-align: center; margin-bottom: 14px;
    color: rgba(var(--ink-soft),0.75);
    font-size: 11.5px; letter-spacing: 0.16em; line-height: 1.7;
  }
  #shelf .tally b { color: rgba(var(--accent),1); font-weight: normal; }
  #shelf h3 {
    margin: 14px 0 8px; font-size: 11.5px; font-weight: normal;
    letter-spacing: 0.3em; color: rgba(var(--ink-soft),0.8);
    border-bottom: 1px solid rgba(var(--ink),0.16); padding-bottom: 5px;
  }
  .shelf-grid { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; }
  .shelf-item {
    width: 58px; text-align: center;
    font-size: 10px; letter-spacing: 0.06em; line-height: 1.5;
    color: rgba(var(--ink),0.9);
  }
  .shelf-item .disc {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 4px;
    border: 1px solid rgba(var(--ink),0.25);
  }
  .shelf-item .bar {
    width: 44px; height: 20px; border-radius: 3px; margin: 0 auto 4px;
    border: 1px solid rgba(var(--ink),0.25);
  }
  .shelf-item.locked { color: rgba(var(--ink-soft),0.45); }
  .shelf-item.locked .disc, .shelf-item.locked .bar { filter: grayscale(1); opacity: 0.26; }
  .shelf-item.pickable { cursor: pointer; }
  .shelf-item.picked .bar {
    box-shadow: 0 0 9px 2px rgba(var(--accent),0.45);
    border-color: rgba(var(--ink),0.85);
  }
  .shelf-item.picked { color: rgba(var(--accent),1); }
  #shelf-close { align-self: center; margin-top: 18px; }

  /* ===== タイトルへもどる ===== */
  #to-title {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(var(--ink),0.6);
    background: none; border: none;
    font-size: 20px; line-height: 1;
    cursor: pointer; z-index: 3;
  }
  #to-title[hidden] { display: none; }
  #to-title:active { color: rgba(var(--accent),1); }

  /* ===== 枠の名前(上にふわっと出る) ===== */
  /* 窓の銘。大正の商標ラベルと同じ組み方 ——
     漢字の銘を大きく、その下に字間をあけた小さな欧文を添える */
  #frame-name {
    position: fixed; top: 10px; left: 50%;
    transform: translateX(-50%);
    text-align: center; line-height: 1.2;
    color: rgba(var(--ink),0.88);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #frame-name .jp {
    display: block;
    font-size: 14px; letter-spacing: 0.34em;
    text-indent: 0.34em;           /* 字間のぶん、右に寄って見えるのを戻す */
  }
  #frame-name .en {
    display: block; margin-top: 3px;
    font-size: 8.5px; letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(var(--ink-soft),0.62);
  }
  #frame-name.show { opacity: 1; }

  /* ===== のこり枚数(右上に控えめに) ===== */
  #remain {
    position: fixed; top: 18px; right: 16px;
    color: rgba(var(--ink-soft),0.7);
    font-size: 12px; letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #remain.hidden { opacity: 0; }

  /* ===== 下部の操作帯(色を選ぶ) =====
     丸は指で押せる大きさに。見た目の丸は 34px、押せる所は 44px
     (Apple の目安と同じ)。画面のいちばん下は、ホームバーを上げる指の
     通り道なので、そこから離して置く */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 9px;
    padding: 8px 0 calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(var(--bar-fade),0.94), rgba(var(--bar-fade),0));
  }
  /* ID 指定は [hidden]{display:none} より強い。閉じている時は必ず消す */
  #bar[hidden] { display: none; }
  /* ===== 引き直しの確認(画面の下に出る) ===== */
  #ask {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    max-width: min(92vw, 420px);
    padding: 10px 12px;
    border: 1px solid rgba(var(--ink),0.24);
    border-radius: 6px;
    background: rgba(var(--panel),0.95);
    color: rgba(var(--ink),0.92);
    font-size: 12px; letter-spacing: 0.06em;
  }
  /* ID 指定は [hidden]{display:none} より強い。閉じている時は必ず消す
     (消し忘れると、操作帯が窓の下をふさいでセルが押せなくなる) */
  #ask[hidden] { display: none; }
  #ask .btn { font-size: 12px; padding: 6px 12px; }
  #ask-yes { border-color: rgba(var(--accent),0.7); }

  /* 色は二段に並べる。持っている色が全部、一目で見えて、なぞらずに押せる。
     一段あたりの数と丸の大きさは layoutSwatches() が実寸から決める */
  #swatches {
    display: grid;
    grid-template-columns: repeat(var(--sw-cols, 5), var(--sw-size, 44px));
    justify-content: center;
    max-width: 100%;
  }
  /* 横向き(背の低い画面)では、操作帯を右の端へ。縦の場所を窓に譲る */
  @media (orientation: landscape) and (max-height: 560px) {
    #bar {
      top: 0; bottom: 0; left: auto; right: 0;
      justify-content: center; gap: 10px;
      padding: 8px calc(8px + env(safe-area-inset-right)) 8px 12px;
      background: linear-gradient(to left, rgba(var(--bar-fade),0.92), rgba(var(--bar-fade),0));
    }
    /* 横向きでは、帯が右端に縦に立つ。段ではなく列で二列に並べる */
    #swatches {
      grid-template-columns: repeat(var(--sw-cols, 2), var(--sw-size, 44px));
      align-content: center;
    }
    #buttons  { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
    #ask {
      position: fixed; left: 12px; bottom: 12px; right: auto;
      max-width: 58vw; margin: 0;
    }
  }
  /* 押せる所と、見える丸を分ける。押せる所は 44px を上限に、
     入る数に合わせて詰める (下限 32px。それも入らない時は段を増やす) */
  .swatch {
    width: var(--sw-size, 44px); height: var(--sw-size, 44px); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border: none; background: none;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .swatch i {
    display: block;
    width: calc(var(--sw-size, 44px) - 8px); height: calc(var(--sw-size, 44px) - 8px);
    border-radius: 50%;
    border: 1px solid rgba(var(--ink),0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch.active i {
    transform: scale(1.14);
    box-shadow: 0 0 9px 2px rgba(var(--accent),0.45);
    border-color: rgba(var(--ink),0.85);
  }
  .swatch:active i { transform: scale(0.92); }
  #buttons { display: flex; gap: 8px; }
  .btn {
    color: rgba(var(--ink),0.9);
    background: none; border: 1px solid rgba(var(--ink),0.3);
    border-radius: 4px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.08em;
    padding: 6px 10px;
    cursor: pointer;
  }
  .btn:active { background: rgba(var(--ink),0.12); }
  .btn.active {
    color: rgba(var(--accent),1);
    border-color: rgba(var(--accent),0.7);
    box-shadow: 0 0 8px rgba(var(--accent),0.22);
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="frame-name"><span class="jp"></span><span class="en"></span></div>
<div id="unlock"></div>

<div id="shelf" hidden>
  <h2>硝 子 棚</h2>
  <div class="tally" id="shelf-tally"></div>
  <h3>硝 子</h3>
  <div class="shelf-grid" id="shelf-colors"></div>
  <h3>木 枠</h3>
  <div class="shelf-grid" id="shelf-frames"></div>
  <button id="shelf-close" class="btn">とじる</button>
</div>
<div id="remain" class="hidden"></div>
<button id="to-title" aria-label="タイトルへもどる" hidden>&#8592;</button>

<div id="bar">
  <div id="swatches"></div>
</div>

<div id="start">
  <img id="start-icon" src="./icon-512.png" alt="ステンドグラス">
  <div id="start-sub">硝子を嵌めて、窓に光を灯す</div>
  <div id="start-tools">
    <button id="theme-toggle" class="btn">暗い部屋にする</button>
    <button id="shelf-open" class="btn">硝子棚</button>
  </div>
  <div id="start-menu">
    <button class="start-btn" id="go-resume" hidden>
      <span class="name">つづきから</span><span class="note" id="resume-note"></span>
    </button>
    <button class="start-btn" data-diff="veasy">
      <span class="name">very easy</span><span class="note">10枚</span>
    </button>
    <button class="start-btn" data-diff="easy">
      <span class="name">easy</span><span class="note">20枚</span>
    </button>
    <button class="start-btn" data-diff="normal">
      <span class="name">normal</span><span class="note">40枚</span>
    </button>
    <button class="start-btn" data-diff="hard">
      <span class="name">hard</span><span class="note">80枚</span>
    </button>
    <button class="start-btn" data-diff="vhard">
      <span class="name">very hard</span><span class="note">140枚</span>
    </button>
  </div>
</div>

<div id="ask" hidden>
  <span id="ask-text">塗りかけの窓を消して、新しく始めますか？</span>
  <button class="btn" id="ask-yes">新しく始める</button>
  <button class="btn" id="ask-no">やめる</button>
</div>

<script>
"use strict";

/* ============================================================
   ステンドグラス(塗り絵方式・難易度制)
   - very easy / easy / normal / hard / very hard の5段階
     (10 / 20 / 40 / 80 / 140枚。段の比がそろうように間隔を置いた)
   - 押すたびに窓の外形(縦長・尖塔・円蓋・四角・丸窓)が
     ランダムに選ばれ、左右対称のランダム分割で枠が生まれる
   - どの段でも時々、手作りの幾何学枠12種が混ざって出る
   - セルをタップすると選択中の色のガラスが嵌まり、
     全て埋まると教会の鐘が鳴って光が差し込む
   ============================================================ */

/* ロジック(枠の割り方・外形・切り抜き)は core.js にある。
   DOM を触らない側に寄せてあるので node だけでテストできる(npm test)。
   ここでは名前を借りて、描画・音・操作に専念する */
const {
  COLOR_FAMILIES, clipConvex, UNIT_RECT, pointInPoly, insidePoint, attachSlivers,
  WINDOW_SHAPES, HANDMADE, HANDMADE_BY_DIFF, makeWindow, DIFF_TARGET, relLuminance,
  pickCurveStyle, buildInBand,
  FRAMES, unlockedColors, unlockedFrames, nextUnlock, newlyUnlocked,
  packWindow, unpackWindow,
} = window.Core;

/* ============================================================
   硝子棚 — 仕上げた窓の数で、使える硝子と木枠が増える
   ------------------------------------------------------------
   増えるだけで、減らさない。数え方は「窓を1つ埋めきったら1」。
   壊れた物が入っていても遊べるように、読む側で必ず検める。
   ============================================================ */
const PROGRESS_KEY = "stained-glass:progress";
let cleared = 0;              /* 仕上げた窓の数 */
let frameKey = FRAMES[0].key; /* 選んでいる木枠 */

function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (d && Number.isInteger(d.cleared) && d.cleared >= 0) cleared = Math.min(d.cleared, 99999);
    if (d && typeof d.frame === "string") frameKey = d.frame;
  } catch (e) { /* 読めなくても遊べる */ }
  /* まだ手に入っていない木枠が入っていたら、最初の物に戻す */
  if (!unlockedFrames(cleared).some(f => f.key === frameKey)) frameKey = FRAMES[0].key;
}
function saveProgress() {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({ cleared, frame: frameKey }));
  } catch (e) { /* 保存できなくても遊べる */ }
}
const curFrame = () => FRAMES.find(f => f.key === frameKey) || FRAMES[0];
loadProgress();

/* 縁取りの帯をめぐらせる割合(たまに縁のない窓も出す) */
const BORDER_CHANCE = 0.7;

/* 塗りかけの窓のしまい場所。開き直したら続きから */
const SAVE_KEY = "stained-glass:window";

/* ============================================================
   配色(テーマ)
   ------------------------------------------------------------
   暗い部屋と白い壁では、硝子の見え方がまるごと変わる。
   背景だけ差し替えると、鉛線・空のセル・木枠・文字がちぐはぐになるので、
   まとめて持っておいて、ひとところで切り替える。
   ============================================================ */
const THEMES = {
  /* 白い壁の部屋(アイコンの雰囲気) */
  day: {
    name: "day",
    themeColor: "#f3ecdd",
    wall: ["#faf6ec", "#f3ecdd", "#e8dcc6"],
    wallGlow: "255,236,196",          /* 完成した時に広がる光 */
    wallGlowAlpha: 0.55,
    glassAlpha: 1,
    /* 白い壁では光を足しすぎない。足すと明るい色が白へ振り切れ、
       乳白の濃淡が消えて「まだ塗っていないセル」とも紛らわしくなる */
    glowBase: 0.03, glowScale: 0.06,
    breatheBase: 0.02, breatheAmp: 0.02, completeBreathe: 0.06,
    lead: "#333f42", leadWidth: 3,    /* 鉛線。アイコンと同じ濃い青灰 */
    /* 空のセルは、壁より冷たく暗い灰。淡すぎると、乳白の硝子と見分けがつかない */
    emptyFill: "rgb(163,172,179)",
    emptyStroke: "rgba(60,70,72,0.3)",
    /* 枠は灰色の板にすると壁から浮くので、アイコンと同じ濃い色で締める */
    frame: ["#46545a", "#36434a", "#2a353b"],
    frameInner: "#f0e9da",
    frameEdge: "rgba(90,74,52,0.18)",
    ray: "120,96,48", rayAlpha: 0.10,
    glint: "255,252,240", glintAlpha: 0.30,
    sweep: "255,244,214",
    ink: "58,68,72", inkSoft: "90,100,104",
    accent: "150,110,40",
    panel: "252,248,240",
    barFade: "247,242,232",
    startBg: "radial-gradient(120% 80% at 50% 30%, rgba(255,246,224,0.95), rgba(243,236,221,0) 70%), linear-gradient(to bottom, #fbf7ee, #f3ecdd 60%, #e9dfcb)",
  },
  /* 薄暗い洋館(これまでの色) */
  night: {
    name: "night",
    themeColor: "#14110e",
    wall: ["#221d17", "#181410", "#0e0b08"],
    wallGlow: "255,235,190",
    wallGlowAlpha: 0.10,
    glassAlpha: 0.95,
    glowBase: 0.05, glowScale: 0.24,
    breatheBase: 0.07, breatheAmp: 0.05, completeBreathe: 0.12,
    lead: "#17130f", leadWidth: 3,
    emptyFill: "rgba(13,19,32,0.9)",
    emptyStroke: "rgba(215,200,170,0.28)",
    frame: ["#4a3626", "#33251a", "#241a12"],
    frameInner: "#15100b",
    frameEdge: "rgba(255,220,170,0.10)",
    ray: "255,240,200", rayAlpha: 0.06,
    glint: "255,245,220", glintAlpha: 0.35,
    sweep: "255,245,215",
    ink: "215,200,170", inkSoft: "215,200,170",
    accent: "255,225,160",
    panel: "20,16,12",
    barFade: "10,8,6",
    startBg: "radial-gradient(120% 80% at 50% 32%, rgba(70,52,30,0.55), rgba(12,10,8,0) 70%), linear-gradient(to bottom, #201b15, #14110e 60%, #0c0a08)",
  },
};

const THEME_KEY = "stained-glass:theme";
let theme = THEMES.day;
try {
  if (localStorage.getItem(THEME_KEY) === "night") theme = THEMES.night;
} catch (e) { /* シークレットウィンドウなど。既定のままでよい */ }

/* 画面(DOM)側の色を流し込む */
function applyTheme(t) {
  theme = t;
  const toggle = document.getElementById("theme-toggle");
  if (toggle) toggle.textContent = t.name === "day" ? "暗い部屋にする" : "白い壁にする";
  const root = document.documentElement.style;
  root.setProperty("--ink", t.ink);
  root.setProperty("--ink-soft", t.inkSoft);
  root.setProperty("--accent", t.accent);
  root.setProperty("--panel", t.panel);
  root.setProperty("--bar-fade", t.barFade);
  root.setProperty("--wall", t.wall[1]);
  root.setProperty("--start-bg", t.startBg);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t.themeColor);
}

const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d");
const barEl = document.getElementById("bar");

/* 嵌めたガラスを焼き込むレイヤー(変化があった時だけ描き直す) */
const glassCv  = document.createElement("canvas");
const glassCtx = glassCv.getContext("2d");

let W = 0, H = 0, DPR = 1;
let PX = 0, PY = 0, PW = 0, PH = 0;   /* パネルの位置と大きさ */
let panelRatio = 0.62;                /* 現在の外形の幅/高さ */

/* 窓のまわりに空けておく場所。難易度はタイトル画面で選ぶので、
   遊ぶ画面に残るのは枠の名前(上)と色の帯(下)だけ */
const TITLE_SPACE = 44;   /* 枠の名前のぶん */
const EDGE = 4;           /* 画面のふちの余白 */

/* 操作帯の大きさ。タイトル画面では隠れていて測れないが、隠れているあいだも
   「遊ぶ時の場所」で窓を組んでおかないと、タイトルと遊ぶ画面で窓の大きさが
   変わってしまう。大きさが変われば、かけらの預け先も変わり、
   「つづきから のこり N」が遊ぶ画面の枚数と1枚ずれる。
   隠れている時は、いったん見えない形で出して測り、覚えておく */
let barBox = null;
function barSize() {
  if (!barEl.hidden) { barBox = barEl.getBoundingClientRect(); return barBox; }
  if (!barBox) {
    barEl.style.visibility = "hidden";
    barEl.hidden = false;
    barBox = barEl.getBoundingClientRect();
    barEl.hidden = true;
    barEl.style.visibility = "";
  }
  return barBox;
}

function layoutPanel() {
  /* 操作帯は、縦向きなら下・横向きなら右。実寸を見て、残りを窓に使う */
  const bar = barSize();
  const sideBar = bar.left > W / 2;               /* 右に寄っている = 横向きの並び */
  const barH = sideBar ? 0 : (bar.height || 84);
  const barW = sideBar ? bar.width : 0;
  const top = W > H ? 24 : TITLE_SPACE;           /* 横向きはさらに詰める */
  const availW = Math.max(80, W - barW - EDGE * 2);
  const availH = Math.max(80, H - top - barH - EDGE);

  /* 入るだけ大きく。木枠は外側へはみ出すので、そのぶんも勘定に入れる */
  let ph = Math.min(availH, availW / panelRatio);
  for (let i = 0; i < 4; i++) {
    const pw = ph * panelRatio;
    const frame = Math.max(9, pw * 0.05) + 2;
    const s = Math.min(1, (availW - frame * 2) / pw, (availH - frame * 2) / ph);
    if (s > 0.999) break;
    ph *= s;
  }
  PH = ph;
  PW = PH * panelRatio;
  PX = EDGE + (availW - PW) / 2;   /* 操作帯を避けた場所で、真ん中に置く */
  PY = top + (availH - PH) / 2;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = W * DPR; cv.height  = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  glassCv.width = W * DPR; glassCv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  glassCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutSwatches();     /* 帯の高さは丸の並べ方で決まる。窓を組む前に決める */
  barBox = null;        /* 画面の大きさが変われば、操作帯も測り直す */
  layoutPanel();
  refreshHosts();
  redrawGlass();
}
window.addEventListener("resize", resize);

/* 単位座標(0〜1)→画面座標 */
const ux = u => PX + u * PW;
const vy = v => PY + v * PH;

let familyIdx = 6;   /* 初期は瑠璃 */

const swatchesEl = document.getElementById("swatches");

/* 硝子の丸の見た目(棚でも使う) */
const shadeDisc = (fam) =>
  `radial-gradient(circle at 35% 35%, ${fam.shades[3]}, ${fam.shades[2]} 72%)`;

/* 棚にある色だけを帯に並べる。窓を仕上げて色が増えたら呼び直す */
function rebuildSwatches() {
  const open = unlockedColors(cleared);
  if (!open.some(f => f === COLOR_FAMILIES[familyIdx])) familyIdx = 6;
  swatchesEl.textContent = "";
  for (const fam of open) {
    const i = COLOR_FAMILIES.indexOf(fam);
    const el = document.createElement("button");
    el.type = "button";
    el.className = "swatch" + (i === familyIdx ? " active" : "");
    el.dataset.family = String(i);
    el.title = fam.name;
    el.setAttribute("aria-label", fam.name);
    const disc = document.createElement("i");
    disc.style.background = shadeDisc(fam);
    el.appendChild(disc);
    el.addEventListener("click", () => {
      familyIdx = i;
      for (const c of swatchesEl.children) c.classList.remove("active");
      el.classList.add("active");
      saveSoon();
    });
    swatchesEl.appendChild(el);
  }
  layoutSwatches();
  barBox = null;        /* 中身が変われば帯の高さも測り直す */
}

/* ------------------------------------------------------------
   色の丸の並べ方を決める
   ------------------------------------------------------------
   持っている色は全部、なぞらずに見えていてほしい。そこで二段に並べる。
   一段あたりの数は「色の数の半分」。そこから、画面の幅に入る大きさを出す。
   押せる所は 44px (Apple の目安) を上限に、詰まってきたら小さくする。
   32px を切るくらい詰まるなら、小さくするより段を増やす。
   横向きのときは帯が右端に縦に立つので、幅ではなく高さで同じことをする。
   ------------------------------------------------------------ */
const SW_MAX = 44, SW_MIN = 32;

function layoutSwatches() {
  const n = swatchesEl.childElementCount;
  if (n === 0) return;
  /* resize() より先に呼ばれることがあるので、実寸は窓から直に取る */
  const vw = W || window.innerWidth, vh = H || window.innerHeight;
  const sideBar = vw > vh && vh <= 560;     /* 横向き = 帯が右端に立つ */
  const room = (sideBar ? vh : vw) - 16;    /* 帯の内側で使える長さ */

  let lines = 2, size = 0, per = 0;
  for (; lines <= 4; lines++) {
    per = Math.ceil(n / lines);
    size = Math.min(SW_MAX, Math.floor(room / per));
    if (size >= SW_MIN) break;
  }
  /* 4段でも入らない画面なら、下限を割ってでも収める */
  if (size < SW_MIN) size = Math.max(20, Math.floor(room / per));

  /* 横向きは「列」が per に当たる。CSS 側は列数として受け取る */
  swatchesEl.style.setProperty("--sw-cols", String(sideBar ? lines : per));
  swatchesEl.style.setProperty("--sw-size", size + "px");
}

function pickShade() {
  const s = COLOR_FAMILIES[familyIdx].shades;
  return s[(Math.random() * s.length) | 0];
}

/* ============================================================
   枠の状態と読み込み
   ============================================================ */
let cells = [];
let fills = [];
let hosts = [];   /* 各セルを押して嵌める時の持ち主(細いかけらは隣に預ける) */
let mids = [];    /* 各セルの「中の一点」。光の差し込みの中心と、押す目当て。
                     形から探すので安くはない。セルが変わった時だけ計算して使い回す */

let completed = false;
let completeGlow = 0;
let curDiff = "normal";       /* いま選んでいる難易度 */
let curShape = null;          /* 外形の key(手作り枠なら null) */
let curHandmade = null;       /* 手作り枠の名前(ランダム枠なら null) */
let shapePoly = WINDOW_SHAPES[0].poly.call(WINDOW_SHAPES[0]);   /* 現在の外形 */

/* 押せる大きさは画面の大きさで変わる(向きを変えた時など)。
   預け先を決め直し、同じ持ち主のセルは同じ硝子にそろえる。
   ※ 一度嵌めた硝子は消さない */
function refreshHosts() {
  mids = cells.map(insidePoint);
  hosts = attachSlivers(cells, PW, PH);
  for (let i = 0; i < cells.length; i++) {
    const h = hosts[i];
    if (h !== i && fills[h] === null && fills[i] !== null) fills[h] = fills[i];
  }
  for (let i = 0; i < cells.length; i++) {
    const h = hosts[i];
    if (h !== i && fills[h] !== null) fills[i] = fills[h];
  }
}

const frameNameEl = document.getElementById("frame-name");
const frameNameJpEl = frameNameEl.querySelector(".jp");
const frameNameEnEl = frameNameEl.querySelector(".en");
const remainEl = document.getElementById("remain");
let nameTimer = null;

function showFrameName(jp, en) {
  frameNameJpEl.textContent = "─ " + jp + " ─";
  frameNameEnEl.textContent = en.toUpperCase();
  frameNameEl.classList.add("show");
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => frameNameEl.classList.remove("show"), 2400);
}

function updateRemain() {
  const n = fills.filter((f, i) => f === null && hosts[i] === i).length;
  if (n === 0) {
    remainEl.classList.add("hidden");
  } else {
    remainEl.textContent = "のこり " + n + " 枚";
    remainEl.classList.remove("hidden");
  }
}

/* 窓を1つ引く(まだ画面には出さない)。
   外形で縦横比が変わるので、割る前に layoutPanel で場所を決め直す */
function drawOneWindow(diffKey) {
  const pool = HANDMADE_BY_DIFF[diffKey];
  if (pool.length > 0 && Math.random() < 0.35) {
    /* 手作り枠(外形は縦長) */
    const name = pool[(Math.random() * pool.length) | 0];
    const hm = HANDMADE.find(f => f.name === name);
    panelRatio = 0.62;
    shapePoly = UNIT_RECT;
    layoutPanel();
    return { cells: hm.build(DIFF_TARGET[diffKey]),   /* 難易度に合わせた細かさで */
             ratio: 0.62, poly: UNIT_RECT, panelW: PW, panelH: PH,
             shape: null, handmade: hm.name, name: hm.jp, en: hm.name };
  }
  /* ランダム枠:外形を抽選し、縁取りの帯をめぐらせて、内側を割る */
  const shape = WINDOW_SHAPES[(Math.random() * WINDOW_SHAPES.length) | 0];
  panelRatio = shape.ratio;
  shapePoly = shape.poly();
  layoutPanel();
  /* 窓ごとに表情を引く: 直線だけ / ほどほど / 曲線多め */
  const style = pickCurveStyle();
  return {
    cells: makeWindow({
      diff: diffKey,
      shapePoly,
      symmetric: Math.random() < 0.5,     /* 対称/非対称は半々 */
      panelW: PW, panelH: PH,
      border: Math.random() < BORDER_CHANCE,
      curve: style.chance > 0,            /* 手作り枠はいつもまっすぐ */
      curveChance: style.chance,
      curveBow: style.bow,
    }),
    ratio: shape.ratio, poly: shapePoly, panelW: PW, panelH: PH,
    shape: shape.key, handmade: null, name: shape.jp, en: shape.name,
  };
}

/* 難易度を選んで新しい窓を用意する。
   出来上がりの押す枚数が目標の帯から外れたら引き直す
   (帯の見張りは手作り枠にしかかかっていなかったので、ここで出来上がりを見る) */
function newWindow(diffKey) {
  curDiff = diffKey;
  const made = buildInBand(diffKey, PW, PH, () => drawOneWindow(diffKey));

  /* 採用した窓の外形で、もう一度場所を決め直してから出す
     (引き直しのあいだに別の縦横比になっていることがある) */
  panelRatio = made.ratio;
  shapePoly = made.poly;
  layoutPanel();
  cells = made.cells;
  curShape = made.shape;
  curHandmade = made.handmade;
  showFrameName(made.name, made.en);

  fills = new Array(cells.length).fill(null);
  refreshHosts();
  completed = false;
  completeGlow = 0;
  glints.length = 0;
  updateRemain();
  redrawGlass();
  saveNow();
}

/* ============================================================
   塗りかけの窓をしまう・取り出す
   ------------------------------------------------------------
   一枚ごとに書き込むと、そのたびに一瞬止まる。書き込みはまとめる。
   閉じられる時(タブを隠す・離れる)は取りこぼさないよう、その場で書く。
   ============================================================ */
let saveTimer = null;

function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (cells.length === 0) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(packWindow({
      diff: curDiff, ratio: panelRatio, shape: curShape, handmade: curHandmade,
      familyIdx, completed, cells, fills,
    })));
  } catch (e) {
    /* 空き容量がない・シークレットウィンドウ。遊ぶのに支障はないので黙って続ける */
  }
}

function saveSoon() {
  if (saveTimer !== null) return;
  saveTimer = setTimeout(saveNow, 700);
}

/* しまってある窓を取り出して組み直す。無ければ false */
function restoreSaved() {
  let win = null;
  try {
    win = unpackWindow(JSON.parse(localStorage.getItem(SAVE_KEY)));
  } catch (e) {
    win = null;
  }
  if (!win) return false;

  curDiff = win.diff;
  curShape = win.shape;
  curHandmade = win.handmade;
  panelRatio = win.ratio;
  shapePoly = win.shape
    ? WINDOW_SHAPES.find(s => s.key === win.shape).poly()
    : UNIT_RECT;
  layoutPanel();
  cells = win.cells;
  fills = win.fills;
  completed = win.completed;
  completeGlow = win.completed ? 1 : 0;
  glints.length = 0;
  refreshHosts();

  familyIdx = win.familyIdx;
  for (let i = 0; i < swatchesEl.children.length; i++) {
    swatchesEl.children[i].classList.toggle("active", i === familyIdx);
  }
  updateRemain();
  redrawGlass();
  return true;
}

/* 閉じられる時は取りこぼさない */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveNow();
});
window.addEventListener("pagehide", saveNow);

/* ============================================================
   引き直しの確認(塗りかけを黙って消さない)
   ============================================================ */
const askEl = document.getElementById("ask");
let pendingDiff = null;

function askRedraw(diffKey) {
  pendingDiff = diffKey;
  askEl.hidden = false;
}
function closeAsk() {
  pendingDiff = null;
  askEl.hidden = true;
}
document.getElementById("ask-yes").addEventListener("click", () => {
  const diff = pendingDiff;
  closeAsk();
  if (!diff) return;
  newWindow(diff);
  enterPlay();
});
document.getElementById("ask-no").addEventListener("click", closeAsk);
/* ============================================================
   タイトル画面と、遊ぶ画面の行き来
   ------------------------------------------------------------
   難易度はタイトルで選ぶ。遊ぶ画面には窓と色だけを残して、
   硝子を画面いっぱいに見せる
   ============================================================ */
const startEl = document.getElementById("start");
const barEl2 = document.getElementById("bar");
const toTitleEl = document.getElementById("to-title");
const resumeEl = document.getElementById("go-resume");
const resumeNoteEl = document.getElementById("resume-note");
let atTitle = true;

function showTitle() {
  atTitle = true;
  closeAsk();
  saveNow();
  /* 塗りかけがあれば「つづきから」を出す */
  const left = fills.filter((f, i) => f === null && hosts[i] === i).length;
  const canResume = cells.length > 0 && !completed && fills.some(f => f !== null);
  resumeEl.hidden = !canResume;
  if (canResume) resumeNoteEl.textContent = `のこり ${left} 枚`;
  startEl.hidden = false;
  startEl.classList.remove("fading");
  barEl2.hidden = true;
  toTitleEl.hidden = true;
  remainEl.classList.add("hidden");
}

function enterPlay() {
  atTitle = false;
  startEl.classList.add("fading");
  setTimeout(() => { if (!atTitle) startEl.hidden = true; }, 450);
  barEl2.hidden = false;
  toTitleEl.hidden = false;
  resize();            /* 操作帯の高さが変わるので測り直す */
  updateRemain();
}

function startNew(diffKey) {
  /* 塗りかけがあれば、消す前に一度だけ聞く */
  const touched = cells.length > 0 && !completed && fills.some(f => f !== null);
  if (touched) { askRedraw(diffKey); return; }
  newWindow(diffKey);
  enterPlay();
}

for (const el of document.querySelectorAll(".start-btn[data-diff]")) {
  el.addEventListener("click", () => startNew(el.dataset.diff));
}
resumeEl.addEventListener("click", () => enterPlay());
toTitleEl.addEventListener("click", showTitle);

/* ============================================================
   描画:セルをオフスクリーンに焼き込む(変化時のみ)
   ============================================================ */
function cellPath(c, poly) {
  c.beginPath();
  c.moveTo(ux(poly[0][0]), vy(poly[0][1]));
  for (let i = 1; i < poly.length; i++) c.lineTo(ux(poly[i][0]), vy(poly[i][1]));
  c.closePath();
}

/* 外形をコンテキストのパスとして描く(クリップ・木枠用) */
function shapePath(c) {
  c.moveTo(ux(shapePoly[0][0]), vy(shapePoly[0][1]));
  for (let i = 1; i < shapePoly.length; i++) {
    c.lineTo(ux(shapePoly[i][0]), vy(shapePoly[i][1]));
  }
  c.closePath();
}

function redrawGlass() {
  glassCtx.clearRect(0, 0, W, H);
  for (let i = 0; i < cells.length; i++) {
    const poly = cells[i];
    cellPath(glassCtx, poly);
    if (fills[i]) {
      glassCtx.fillStyle = fills[i];
      glassCtx.globalAlpha = theme.glassAlpha;
      glassCtx.fill();
      const mid = mids[i] || insidePoint(poly);
      const cx = ux(mid[0]), cy = vy(mid[1]);
      const rad = Math.max(8, Math.hypot(ux(poly[0][0]) - cx, vy(poly[0][1]) - cy));
      /* 光の差し込み。暗い硝子ほど控えめにする。
         どの色にも同じだけ白を足すと、深い藍も深い臙脂も中間色になり、
         同じ系統の濃淡も見分けがつかなくなる */
      const glow = theme.glowBase + theme.glowScale * relLuminance(fills[i]);
      const g = glassCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, `rgba(255,255,255,${glow})`);
      g.addColorStop(1, "rgba(255,255,255,0)");
      glassCtx.fillStyle = g;
      glassCtx.fill();
      glassCtx.globalAlpha = 1;
      glassCtx.strokeStyle = theme.lead;
      glassCtx.lineWidth = theme.leadWidth;
      glassCtx.lineJoin = "round";
      glassCtx.stroke();
    } else {
      glassCtx.fillStyle = theme.emptyFill;
      glassCtx.globalAlpha = 1;
      glassCtx.fill();
      glassCtx.strokeStyle = theme.emptyStroke;
      glassCtx.lineWidth = 1.2;
      glassCtx.lineJoin = "round";
      glassCtx.stroke();
    }
  }
}

/* ============================================================
   音:Web Audio APIで教会の鐘を合成
   ============================================================ */
let audio = null;
function ensureAudio() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) audio = new AC();
}

function bellStrike(base, when, vol) {
  if (!audio) return;
  const partials = [
    { f: 0.50, g: 0.55, d: 6.0 },   /* ハム(唸りの土台) */
    { f: 1.00, g: 1.00, d: 4.5 },   /* プライム */
    { f: 1.19, g: 0.55, d: 3.2 },   /* ティアス(短三度:鐘特有の哀愁) */
    { f: 1.50, g: 0.35, d: 2.6 },   /* クイント */
    { f: 2.00, g: 0.50, d: 2.2 },   /* ノミナル */
    { f: 2.66, g: 0.18, d: 1.2 },
    { f: 3.98, g: 0.10, d: 0.8 },
  ];
  for (const p of partials) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = base * p.f * (1 + (Math.random() - 0.5) * 0.004);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(p.g * vol, when + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + p.d);
    osc.connect(gain).connect(audio.destination);
    osc.start(when);
    osc.stop(when + p.d + 0.1);
  }
}

function pealBells() {
  ensureAudio();
  if (!audio) return;
  const t0 = audio.currentTime + 0.05;
  const bells = [
    { base: 174.6, interval: 2.1, offset: 0.0, vol: 0.22 },
    { base: 220.0, interval: 1.7, offset: 0.7, vol: 0.17 },
    { base: 261.6, interval: 1.4, offset: 1.3, vol: 0.13 },
  ];
  for (const b of bells) {
    for (let t = b.offset; t < 8.5; t += b.interval) {
      bellStrike(b.base, t0 + t + Math.random() * 0.12, b.vol);
    }
  }
}

/* ============================================================
   タップ音:ワイングラスを爪で軽く弾いたような澄んだ「チン」
   ------------------------------------------------------------
   ・グラスの振動モード(基音の約2.3倍・4.2倍の非整数倍音)を
     サイン波で重ねると、あの硝子特有の透明な響きになる
   ・基音をペンタトニックの高音域から選ぶので、連打しても
     風鈴のように音楽的で耳障りになりにくい
   ・ごく近い音程の2本をわずかにうならせて、余韻に艶を出す
   ============================================================ */
const TING_NOTES = [1568.0, 1760.0, 2093.0, 2349.3, 2637.0];  /* G6 A6 C7 D7 E7 */

let lastTing = 0;
function glassTing() {
  if (!audio) return;
  /* なぞると一度に何枚も嵌まる。重ねすぎると濁るので、鳴らす間隔に下限を置く */
  const now = performance.now();
  if (now - lastTing < 55) return;
  lastTing = now;
  const t = audio.currentTime;
  const base = TING_NOTES[(Math.random() * TING_NOTES.length) | 0];
  const vol = 0.055 + Math.random() * 0.02;   /* 音量もわずかに揺らす */

  /* 硝子の振動モード:比率・強さ・余韻の長さ */
  const modes = [
    { f: 1.000, g: 1.00, d: 0.75 },   /* 基音(いちばん長く残る) */
    { f: 1.004, g: 0.60, d: 0.65 },   /* ごく近い音とのうなり=艶 */
    { f: 2.32,  g: 0.22, d: 0.32 },   /* 第2モード */
    { f: 4.20,  g: 0.07, d: 0.14 },   /* 第3モード(弾いた瞬間の光沢) */
  ];
  for (const m of modes) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = base * m.f;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(m.g * vol, t + 0.004);  /* 爪で弾く立ち上がり */
    gain.gain.exponentialRampToValueAtTime(0.0001, t + m.d);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + m.d + 0.05);
  }
}

/* ============================================================
   入力:セルをタップして色を灯す。はらうと光の帯
   ============================================================ */
const pointer = { down: false, painting: false, x: 0, y: 0 };

const trail = [];
const FLICK_SPEED = 2200;
function pushTrail(x, y) {
  const t = performance.now();
  trail.push({ x, y, t });
  while (trail.length > 0 && t - trail[0].t > 100) trail.shift();
}
let lightSweep = null;

/* 指の下にあるセルの番号。窓の外なら -1 */
function cellAt(x, y) {
  const u = (x - PX) / PW, v = (y - PY) / PH;
  if (u < 0 || u > 1 || v < 0 || v > 1) return -1;
  for (let i = 0; i < cells.length; i++) {
    if (pointInPoly(u, v, cells[i])) return i;
  }
  return -1;
}

/* 持ち主と、その連れに硝子を嵌める。
   defer=true なら描き直しは呼び手に任せる(なぞりで何枚も嵌める時用) */
function fillGroup(h, defer) {
  /* 未記入なら嵌める。既に有れば必ず違う色味に差し替える */
  let c;
  do { c = pickShade(); } while (c === fills[h]);
  for (let k = 0; k < cells.length; k++) {
    if (hosts[k] === h) fills[k] = c;   /* 持ち主と連れは同じ硝子 */
  }
  if (!defer) redrawGlass();
  glassTing();
  glints.push({ idx: h, t: 0, dur: 0.5 });
  updateRemain();
  if (!completed && fills.every(f => f !== null)) {
    completed = true;
    pealBells();
    countCleared();
    saveNow();
  } else {
    saveSoon();
  }
}

/* 窓を1つ仕上げた。棚に何か増えたら知らせる */
function countCleared() {
  const before = cleared;
  cleared++;
  saveProgress();
  const got = newlyUnlocked(before, cleared);
  if (!got.length) return;
  rebuildSwatches();            /* 増えた色は、その場で使える */
  showUnlockNote(got);
}

/* 「棚に ○○ が加わりました」。鐘のあと、少し遅らせて出す */
function showUnlockNote(got) {
  const what = got.map(g => g.name).join(" と ");
  const kind = got.every(g => g.kind === "frame") ? "木枠" : "硝子";
  clearTimeout(unlockTimer);
  unlockTimer = setTimeout(() => {
    unlockEl.textContent = `硝子棚に ${kind}「${what}」が加わりました`;
    unlockEl.classList.add("show");
    unlockTimer = setTimeout(() => unlockEl.classList.remove("show"), 4200);
  }, 900);
}

/* 押す:空いていれば嵌める。嵌まっていれば色味を差し替える */
function tapCell(x, y) {
  const i = cellAt(x, y);
  if (i >= 0) fillGroup(hosts[i]);
}

/* ============================================================
   なぞり塗り
   ------------------------------------------------------------
   ・ひと続きのなぞりで、同じセルは一度だけ
   ・空いているセルだけ嵌める。すでに嵌まっている物は塗り替えない
     (うっかり指をすべらせても、塗った物は壊れない。塗り替えは押して行う)
   ・指の動きは飛び飛びで届くので、前の点との間を細かく埋めて拾う
   ============================================================ */
const strokeDone = new Set();   /* このなぞりで、もう触ったセルの持ち主 */

function paintAt(x, y) {
  const i = cellAt(x, y);
  if (i < 0) return false;
  const h = hosts[i];
  if (strokeDone.has(h)) return false;
  strokeDone.add(h);
  if (fills[h] !== null) return false;
  fillGroup(h, true);   /* 描き直しは、なぞり終わりにまとめて一度 */
  return true;
}

function paintAlong(x0, y0, x1, y1) {
  const dist = Math.hypot(x1 - x0, y1 - y0);
  /* 3px ごとに拾う。6px 刻みだと、指が横切った長さが 6px に満たないセル
     (斜めに掠めた所) を飛ばしてしまい、なぞった道すじに塗り残しが出る */
  const steps = Math.max(1, Math.ceil(dist / 3));
  let painted = false;
  for (let s = 1; s <= steps; s++) {
    if (paintAt(x0 + (x1 - x0) * s / steps, y0 + (y1 - y0) * s / steps)) painted = true;
  }
  if (painted) redrawGlass();   /* 一度にまとめて描き直す */
  return painted;
}

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  ensureAudio();
  pointer.down = true;
  /* 窓の中から始めたら「なぞり塗り」。外(暗がり)から始めたら「光のはらい」。
     こうしないと、光を出そうとするたびに硝子が 1 枚嵌まってしまう */
  pointer.painting = cellAt(e.clientX, e.clientY) >= 0;
  pointer.x = e.clientX; pointer.y = e.clientY;
  strokeDone.clear();
  trail.length = 0;
  pushTrail(e.clientX, e.clientY);
  if (pointer.painting) {
    const i = cellAt(e.clientX, e.clientY);
    strokeDone.add(hosts[i]);
    fillGroup(hosts[i]);
  }
});
cv.addEventListener("pointermove", e => {
  e.preventDefault();
  if (!pointer.down) return;
  pushTrail(e.clientX, e.clientY);
  if (pointer.painting) paintAlong(pointer.x, pointer.y, e.clientX, e.clientY);
  pointer.x = e.clientX; pointer.y = e.clientY;
});
function onUp() {
  if (!pointer.down) return;
  pointer.down = false;
  strokeDone.clear();
  if (trail.length >= 2) {
    const a = trail[0], b = trail[trail.length - 1];
    const dtms = b.t - a.t;
    if (dtms > 15) {
      const vx = (b.x - a.x) / dtms * 1000;
      const vy2 = (b.y - a.y) / dtms * 1000;
      const sp = Math.hypot(vx, vy2);
      /* はらいの光は、窓の外から始めた時だけ(塗りと取り合わない) */
      if (sp >= FLICK_SPEED && !pointer.painting) {
        lightSweep = { t: 0, dx: vx / sp, dy: vy2 / sp };
      }
    }
  }
  trail.length = 0;
}
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ============================================================
   きらめき
   ============================================================ */
const glints = [];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let glintTimer = 0;

function updateGlints(dt) {
  glintTimer -= dt;
  if (glintTimer <= 0 && !reduceMotion) {
    const filledIdx = [];
    for (let i = 0; i < fills.length; i++) if (fills[i]) filledIdx.push(i);
    if (filledIdx.length > 0) {
      glintTimer = 0.5 + Math.random() * 0.6;
      glints.push({
        idx: filledIdx[(Math.random() * filledIdx.length) | 0],
        t: 0, dur: 0.9,
      });
    } else {
      glintTimer = 0.5;
    }
  }
  for (let i = glints.length - 1; i >= 0; i--) {
    glints[i].t += dt;
    if (glints[i].t > glints[i].dur) glints.splice(i, 1);
  }
}

/* ============================================================
   背景・木枠・光
   ============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, theme.wall[0]);
  g.addColorStop(0.55, theme.wall[1]);
  g.addColorStop(1, theme.wall[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (completeGlow > 0) {
    const gg = ctx.createRadialGradient(W / 2, PY + PH / 2, 0, W / 2, PY + PH / 2, Math.max(W, H));
    gg.addColorStop(0, `rgba(${theme.wallGlow},${theme.wallGlowAlpha * completeGlow})`);
    gg.addColorStop(1, `rgba(${theme.wallGlow},0)`);
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWoodFrame() {
  /* 外形に沿った木枠:外形パスを太い線で縁取る */
  const b = Math.max(9, PW * 0.05);
  ctx.save();
  ctx.beginPath();
  shapePath(ctx);
  const wood = curFrame().wood;
  const wg = ctx.createLinearGradient(PX, PY, PX + PW, PY + PH);
  wg.addColorStop(0, wood[0]);
  wg.addColorStop(0.5, wood[1]);
  wg.addColorStop(1, wood[2]);
  ctx.strokeStyle = wg;
  ctx.lineWidth = b * 2;
  ctx.lineJoin = "round";
  ctx.stroke();
  /* 内側の細い縁と、外側のわずかなハイライト */
  ctx.strokeStyle = theme.frameInner;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = curFrame().edge;
  ctx.lineWidth = b * 2 + 2;
  ctx.stroke();
  ctx.restore();
}

function drawCompleteRays(time) {
  if (completeGlow <= 0.01) return;
  const cx = W / 2, cy = PY + PH * 0.4;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  /* 窓の外側だけに光が漏れる(外形を除外してクリップ) */
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  shapePath(ctx);
  ctx.clip("evenodd");
  const N = 7;
  for (let i = 0; i < N; i++) {
    const a = Math.PI * 0.5 + (i - (N - 1) / 2) * 0.16 + Math.sin(time * 0.3 + i) * 0.02;
    const len = Math.max(W, H) * 1.2;
    const x2 = cx + Math.cos(a) * len, y2 = cy + Math.sin(a) * len;
    const lg = ctx.createLinearGradient(cx, cy, x2, y2);
    lg.addColorStop(0, `rgba(${theme.ray},${theme.rayAlpha * completeGlow})`);
    lg.addColorStop(1, `rgba(${theme.ray},0)`);
    ctx.strokeStyle = lg;
    ctx.lineWidth = PW * (0.10 + (i % 3) * 0.05);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   メインループ
   ============================================================ */
let lastT = performance.now();

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const time = now / 1000;

  updateGlints(dt);
  if (completed && completeGlow < 1) completeGlow = Math.min(completeGlow + dt * 0.4, 1);

  drawBackground();

  /* 硝子本体+呼吸する裏光 */
  ctx.drawImage(glassCv, 0, 0, W, H);
  /* 裏から射す光の呼吸。強くしすぎると明るい硝子が振り切れて白く濁る */
  const breathe = (reduceMotion ? theme.breatheBase
                                : theme.breatheBase + theme.breatheAmp * Math.sin(time * 0.9))
                + completeGlow * theme.completeBreathe;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.max(0, breathe);
  ctx.drawImage(glassCv, 0, 0, W, H);
  ctx.restore();

  /* きらめき */
  if (glints.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const g of glints) {
      if (!cells[g.idx] || !fills[g.idx]) continue;
      const a = Math.sin(g.t / g.dur * Math.PI);
      ctx.globalAlpha = a * theme.glintAlpha;
      cellPath(ctx, cells[g.idx]);
      ctx.fillStyle = `rgb(${theme.glint})`;
      ctx.fill();
    }
    ctx.restore();
  }

  /* はらいの光の帯(窓の中だけを照らす) */
  if (lightSweep) {
    lightSweep.t += dt;
    const p = lightSweep.t / 0.9;
    if (p >= 1) {
      lightSweep = null;
    } else {
      const d = lightSweep;
      const span = Math.max(W, H) * 1.6;
      const cx = W / 2 + d.dx * span * (p - 0.5);
      const cy = PY + PH / 2 + d.dy * span * (p - 0.5);
      const lg = ctx.createLinearGradient(
        cx - d.dx * PW, cy - d.dy * PW,
        cx + d.dx * PW, cy + d.dy * PW
      );
      const a = Math.sin(p * Math.PI) * 0.22;
      lg.addColorStop(0,   `rgba(${theme.sweep},0)`);
      lg.addColorStop(0.5, `rgba(${theme.sweep},${a})`);
      lg.addColorStop(1,   `rgba(${theme.sweep},0)`);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      shapePath(ctx);
      ctx.clip();
      ctx.fillStyle = lg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  drawCompleteRays(time);
  drawWoodFrame();

  requestAnimationFrame(frame);
}

/* ============================================================
   起動:タイトル画面から。前の窓は読み込んでおき、
   塗りかけなら「つづきから」を出す
   ============================================================ */
applyTheme(theme);

/* 壁の色を切り替える(タイトル画面) */
document.getElementById("theme-toggle").addEventListener("click", () => {
  applyTheme(theme.name === "day" ? THEMES.night : THEMES.day);
  try { localStorage.setItem(THEME_KEY, theme.name); } catch (e) { /* 保存できなくても遊べる */ }
  redrawGlass();
  if (!shelfEl.hidden) buildShelf();   /* 棚を開いたまま壁を変えた時 */
});

/* ============================================================
   硝子棚:持っている物と、つぎに増える物を並べる
   ------------------------------------------------------------
   まだ手に入っていない物も、灰色で「あと何窓か」を添えて見せる。
   何が待っているか見えるほうが、次の窓を引く手が動く
   ============================================================ */
const shelfEl = document.getElementById("shelf");
const shelfTallyEl = document.getElementById("shelf-tally");
const shelfColorsEl = document.getElementById("shelf-colors");
const shelfFramesEl = document.getElementById("shelf-frames");

function buildShelf() {
  const next = nextUnlock(cleared);
  shelfTallyEl.innerHTML =
    `仕上げた窓 <b>${cleared}</b><br>` +
    (next
      ? `つぎは ${next.kind === "frame" ? "木枠" : "硝子"}「${next.name}」 ・ あと <b>${next.left}</b> 窓`
      : "棚はすべて埋まりました");

  shelfColorsEl.textContent = "";
  for (const fam of COLOR_FAMILIES) {
    const open = fam.at <= cleared;
    const el = document.createElement("div");
    el.className = "shelf-item" + (open ? "" : " locked");
    const disc = document.createElement("div");
    disc.className = "disc";
    disc.style.background = shadeDisc(fam);
    el.appendChild(disc);
    el.appendChild(document.createTextNode(open ? fam.name : `${fam.at}窓`));
    shelfColorsEl.appendChild(el);
  }

  shelfFramesEl.textContent = "";
  for (const f of FRAMES) {
    const open = f.at <= cleared;
    const el = document.createElement("div");
    el.className = "shelf-item" + (open ? " pickable" : " locked") +
      (f.key === frameKey ? " picked" : "");
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.background =
      `linear-gradient(135deg, ${f.wood[0]}, ${f.wood[1]} 50%, ${f.wood[2]})`;
    el.appendChild(bar);
    el.appendChild(document.createTextNode(open ? f.name : `${f.at}窓`));
    if (open) {
      el.addEventListener("click", () => {
        frameKey = f.key;
        saveProgress();
        buildShelf();
      });
    }
    shelfFramesEl.appendChild(el);
  }
}

document.getElementById("shelf-open").addEventListener("click", () => {
  buildShelf();
  shelfEl.hidden = false;
});
document.getElementById("shelf-close").addEventListener("click", () => {
  shelfEl.hidden = true;
});

const unlockEl = document.getElementById("unlock");
let unlockTimer = null;

restoreSaved();
rebuildSwatches();   /* 帯の高さは中身で決まる。窓を組む前に並べておく */
resize();
showTitle();
requestAnimationFrame(frame);

/* ============================================================
   テストからのぞく入口(browser-test.js が使う)
   ============================================================ */
window.__app = {
  /* いまの窓の中身 */
  state: () => ({
    cells, fills, hosts, completed,
    /* 画面の「n left」と同じ数え方(あと何回押せば埋まるか) */
    remain: fills.filter((f, i) => f === null && hosts[i] === i).length,
    remainCells: fills.filter(f => f === null).length,
    panel: { x: PX, y: PY, w: PW, h: PH },
    diff: curDiff, shape: curShape, handmade: curHandmade,
  }),
  /* セルの中心の画面座標(指で押す場所を測るのに使う) */
  cellAtXY: (x, y) => cellAt(x, y),
  cellCenter: (i) => {
    const mid = mids[i] || insidePoint(cells[i]);
    return { x: ux(mid[0]), y: vy(mid[1]) };
  },
  newWindow,
  /* いまどちらの画面か / 画面を移る(テストから) */
  screen: () => (atTitle ? "title" : "play"),
  theme: () => theme.name,
  showTitle: () => showTitle(),
  enterPlay: () => enterPlay(),
  /* 見比べ用: 決まった枠をそのまま出す */
  setWindow: (list, shape, diff) => {
    curDiff = diff; curShape = shape.key; curHandmade = null;
    panelRatio = shape.ratio; shapePoly = shape.poly(); layoutPanel();
    cells = list; fills = new Array(cells.length).fill(null);
    refreshHosts(); completed = false; completeGlow = 0; glints.length = 0;
    updateRemain(); redrawGlass();
  },
  tapCell,
  paintAlong,
  saveKey: SAVE_KEY,
  /* 硝子棚のようす */
  cleared: () => cleared,
  frame: () => frameKey,
  sweeping: () => lightSweep !== null,
  asking: () => !document.getElementById("ask").hidden,
  /* 音を鳴らさずに全部埋める(完成時の見た目だけ確かめたい時) */
  fillAll: () => {
    for (let i = 0; i < fills.length; i++) if (!fills[i]) fills[i] = pickShade();
    for (let i = 0; i < fills.length; i++) fills[i] = fills[hosts[i]];   /* 連れは持ち主と同じ硝子 */
    completed = true;
    redrawGlass();
    updateRemain();
  },
};

/* ============================================================
   PWA:Service Worker登録(オフラインでも遊べるように)
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* 登録失敗時も通常のWebページとして動くので何もしない */
    });
  });
}
</script>
</body>
</html>
