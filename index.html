<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ステンドグラス</title>
<!-- ===== PWA設定 ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14110e">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<!-- iOS: ホーム画面追加用 -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ステンドグラス">
<script src="./core.js"></script>
<style>
  /* ===== 全体:大正の洋館の薄暗がり ===== */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #14110e;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  canvas { display: block; }

  /* ===== 題:英語タイトル(上部中央に常時) ===== */
  #title {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    color: rgba(215,200,170,0.8);
    font-size: 15px; letter-spacing: 0.42em;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(215,190,140,0.25);
    white-space: nowrap;
  }

  /* ===== 枠の名前(タイトルの下にふわっと出る) ===== */
  #frame-name {
    position: fixed; top: 44px; left: 50%;
    transform: translateX(-50%);
    color: rgba(215,200,170,0.85);
    font-size: 13px; letter-spacing: 0.3em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    text-shadow: 0 0 10px rgba(215,190,140,0.3);
  }
  #frame-name.show { opacity: 1; }

  /* ===== のこり枚数(右上に控えめに) ===== */
  #remain {
    position: fixed; top: 18px; right: 16px;
    color: rgba(215,200,170,0.5);
    font-size: 12px; letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #remain.hidden { opacity: 0; }

  /* ===== 下部の操作帯(2段:上=色、下=ボタン) ===== */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 9px;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,8,6,0.88), rgba(10,8,6,0));
  }
  /* ===== 引き直しの確認(操作帯の上に出る) ===== */
  #ask {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    padding: 8px 10px; margin-bottom: 2px;
    border: 1px solid rgba(215,200,170,0.22);
    border-radius: 6px;
    background: rgba(20,16,12,0.92);
    color: rgba(215,200,170,0.9);
    font-size: 12px; letter-spacing: 0.06em;
  }
  /* ID 指定は [hidden]{display:none} より強い。閉じている時は必ず消す
     (消し忘れると、操作帯が窓の下をふさいでセルが押せなくなる) */
  #ask[hidden] { display: none; }
  #ask .btn { font-size: 12px; padding: 6px 12px; }
  #ask-yes { border-color: rgba(215,190,140,0.55); }

  #swatches {
    display: flex; gap: 7px; justify-content: center; flex-wrap: nowrap;
  }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }
  .swatch.active {
    transform: scale(1.22);
    box-shadow: 0 0 9px 2px rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.75);
  }
  #buttons { display: flex; gap: 8px; }
  .btn {
    color: rgba(215,200,170,0.85);
    background: none; border: 1px solid rgba(215,200,170,0.3);
    border-radius: 4px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.08em;
    padding: 6px 10px;
    cursor: pointer;
  }
  .btn:active { background: rgba(215,200,170,0.12); }
  .btn.active {
    color: #ffe9b8;
    border-color: rgba(255,225,160,0.7);
    box-shadow: 0 0 8px rgba(255,220,150,0.2);
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="title">Light the Glass</div>
<div id="frame-name"></div>
<div id="remain" class="hidden"></div>

<div id="bar">
  <div id="ask" hidden>
    <span id="ask-text">塗りかけの窓を消して、引き直しますか？</span>
    <button class="btn" id="ask-yes">引き直す</button>
    <button class="btn" id="ask-no">やめる</button>
  </div>
  <div id="swatches"></div>
  <div id="buttons">
    <button class="btn" id="btn-easy">easy</button>
    <button class="btn" id="btn-normal">normal</button>
    <button class="btn" id="btn-hard">hard</button>
    <button class="btn" id="btn-vhard">very hard</button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   ステンドグラス(塗り絵方式・難易度制)
   - easy / normal / hard / very hard の4段階
   - 押すたびに窓の外形(縦長・尖塔・円蓋・四角・丸窓)が
     ランダムに選ばれ、左右対称のランダム分割で枠が生まれる
   - easy〜hard では時々、手作りの幾何学枠10種が混ざって出る
   - セルをタップすると選択中の色のガラスが嵌まり、
     全て埋まると教会の鐘が鳴って光が差し込む
   ============================================================ */

/* ロジック(枠の割り方・外形・切り抜き)は core.js にある。
   DOM を触らない側に寄せてあるので node だけでテストできる(npm test)。
   ここでは名前を借りて、描画・音・操作に専念する */
const {
  COLOR_FAMILIES, clipConvex, UNIT_RECT, pointInPoly, attachSlivers,
  WINDOW_SHAPES, HANDMADE, HANDMADE_BY_DIFF, randomFrame, DIFF_TARGET,
  packWindow, unpackWindow,
} = window.Core;

/* 塗りかけの窓のしまい場所。開き直したら続きから */
const SAVE_KEY = "stained-glass:window";

const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* 嵌めたガラスを焼き込むレイヤー(変化があった時だけ描き直す) */
const glassCv  = document.createElement("canvas");
const glassCtx = glassCv.getContext("2d");

let W = 0, H = 0, DPR = 1;
let PX = 0, PY = 0, PW = 0, PH = 0;   /* パネルの位置と大きさ */
let panelRatio = 0.62;                /* 現在の外形の幅/高さ */

function layoutPanel() {
  PH = H * 0.62;
  PW = PH * panelRatio;
  if (PW > W * 0.86) { PW = W * 0.86; PH = PW / panelRatio; }
  PX = (W - PW) / 2;
  PY = (H - PH) / 2 - H * 0.03;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = W * DPR; cv.height  = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  glassCv.width = W * DPR; glassCv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  glassCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutPanel();
  refreshHosts();
  redrawGlass();
}
window.addEventListener("resize", resize);

/* 単位座標(0〜1)→画面座標 */
const ux = u => PX + u * PW;
const vy = v => PY + v * PH;

let familyIdx = 6;   /* 初期は瑠璃 */

const swatchesEl = document.getElementById("swatches");
COLOR_FAMILIES.forEach((fam, i) => {
  const el = document.createElement("div");
  el.className = "swatch" + (i === familyIdx ? " active" : "");
  el.title = fam.name;
  el.style.background =
    `radial-gradient(circle at 35% 35%, ${fam.shades[3]}, ${fam.shades[2]} 72%)`;
  el.addEventListener("click", () => {
    familyIdx = i;
    for (const c of swatchesEl.children) c.classList.remove("active");
    el.classList.add("active");
    saveSoon();
  });
  swatchesEl.appendChild(el);
});

function pickShade() {
  const s = COLOR_FAMILIES[familyIdx].shades;
  return s[(Math.random() * s.length) | 0];
}

/* ============================================================
   枠の状態と読み込み
   ============================================================ */
let cells = [];
let fills = [];
let hosts = [];   /* 各セルを押して嵌める時の持ち主(細いかけらは隣に預ける) */

let completed = false;
let completeGlow = 0;
let curDiff = "normal";       /* いま選んでいる難易度 */
let curShape = null;          /* 外形の key(手作り枠なら null) */
let curHandmade = null;       /* 手作り枠の名前(ランダム枠なら null) */
let shapePoly = WINDOW_SHAPES[0].poly.call(WINDOW_SHAPES[0]);   /* 現在の外形 */

/* 押せる大きさは画面の大きさで変わる(向きを変えた時など)。
   預け先を決め直し、同じ持ち主のセルは同じ硝子にそろえる。
   ※ 一度嵌めた硝子は消さない */
function refreshHosts() {
  hosts = attachSlivers(cells, PW, PH);
  for (let i = 0; i < cells.length; i++) {
    const h = hosts[i];
    if (h !== i && fills[h] === null && fills[i] !== null) fills[h] = fills[i];
  }
  for (let i = 0; i < cells.length; i++) {
    const h = hosts[i];
    if (h !== i && fills[h] !== null) fills[i] = fills[h];
  }
}

const frameNameEl = document.getElementById("frame-name");
const remainEl = document.getElementById("remain");
let nameTimer = null;

function showFrameName(name) {
  frameNameEl.textContent = "─ " + name + " ─";
  frameNameEl.classList.add("show");
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => frameNameEl.classList.remove("show"), 2400);
}

function updateRemain() {
  const n = fills.filter((f, i) => f === null && hosts[i] === i).length;
  if (n === 0) {
    remainEl.classList.add("hidden");
  } else {
    remainEl.textContent = n + " left";
    remainEl.classList.remove("hidden");
  }
}

/* 難易度を選んで新しい窓を用意する */
function newWindow(diffKey) {
  curDiff = diffKey;
  /* ボタンの点灯 */
  for (const [k, id] of Object.entries(DIFF_BTN)) {
    document.getElementById(id).classList.toggle("active", k === diffKey);
  }

  const pool = HANDMADE_BY_DIFF[diffKey];
  if (pool.length > 0 && Math.random() < 0.35) {
    /* 手作り枠(外形は縦長) */
    const name = pool[(Math.random() * pool.length) | 0];
    const hm = HANDMADE.find(f => f.name === name);
    panelRatio = 0.62;
    shapePoly = UNIT_RECT;
    layoutPanel();
    cells = hm.build(DIFF_TARGET[diffKey]);   /* 難易度に合わせた細かさで */
    curShape = null;
    curHandmade = hm.name;
    showFrameName(hm.name);
  } else {
    /* ランダム枠:外形を抽選して左右対称生成、外形で切り抜く */
    const shape = WINDOW_SHAPES[(Math.random() * WINDOW_SHAPES.length) | 0];
    panelRatio = shape.ratio;
    shapePoly = shape.poly();
    layoutPanel();
    const raw = randomFrame(diffKey, shape.ratio, Math.random() < 0.5, PW, PH);   /* 対称/非対称は半々 */
    cells = [];
    for (const poly of raw) {
      const clipped = shape.key === "rect" || shape.key === "square"
        ? poly : clipConvex(poly, shapePoly);
      if (clipped) cells.push(clipped);
    }
    curShape = shape.key;
    curHandmade = null;
    showFrameName(shape.name);
  }

  fills = new Array(cells.length).fill(null);
  refreshHosts();
  completed = false;
  completeGlow = 0;
  glints.length = 0;
  updateRemain();
  redrawGlass();
  saveNow();
}

const DIFF_BTN = {
  easy: "btn-easy", normal: "btn-normal", hard: "btn-hard", vhard: "btn-vhard",
};

/* ============================================================
   塗りかけの窓をしまう・取り出す
   ------------------------------------------------------------
   一枚ごとに書き込むと、そのたびに一瞬止まる。書き込みはまとめる。
   閉じられる時(タブを隠す・離れる)は取りこぼさないよう、その場で書く。
   ============================================================ */
let saveTimer = null;

function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (cells.length === 0) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(packWindow({
      diff: curDiff, ratio: panelRatio, shape: curShape, handmade: curHandmade,
      familyIdx, completed, cells, fills,
    })));
  } catch (e) {
    /* 空き容量がない・シークレットウィンドウ。遊ぶのに支障はないので黙って続ける */
  }
}

function saveSoon() {
  if (saveTimer !== null) return;
  saveTimer = setTimeout(saveNow, 700);
}

/* しまってある窓を取り出して組み直す。無ければ false */
function restoreSaved() {
  let win = null;
  try {
    win = unpackWindow(JSON.parse(localStorage.getItem(SAVE_KEY)));
  } catch (e) {
    win = null;
  }
  if (!win) return false;

  curDiff = win.diff;
  curShape = win.shape;
  curHandmade = win.handmade;
  panelRatio = win.ratio;
  shapePoly = win.shape
    ? WINDOW_SHAPES.find(s => s.key === win.shape).poly()
    : UNIT_RECT;
  layoutPanel();
  cells = win.cells;
  fills = win.fills;
  completed = win.completed;
  completeGlow = win.completed ? 1 : 0;
  glints.length = 0;
  refreshHosts();

  familyIdx = win.familyIdx;
  for (let i = 0; i < swatchesEl.children.length; i++) {
    swatchesEl.children[i].classList.toggle("active", i === familyIdx);
  }
  for (const [k, id] of Object.entries(DIFF_BTN)) {
    document.getElementById(id).classList.toggle("active", k === curDiff);
  }
  updateRemain();
  redrawGlass();
  return true;
}

/* 閉じられる時は取りこぼさない */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveNow();
});
window.addEventListener("pagehide", saveNow);

/* ============================================================
   引き直しの確認(塗りかけを黙って消さない)
   ============================================================ */
const askEl = document.getElementById("ask");
let pendingDiff = null;

function askRedraw(diffKey) {
  pendingDiff = diffKey;
  askEl.hidden = false;
}
function closeAsk() {
  pendingDiff = null;
  askEl.hidden = true;
}
document.getElementById("ask-yes").addEventListener("click", () => {
  const diff = pendingDiff;
  closeAsk();
  if (diff) newWindow(diff);
});
document.getElementById("ask-no").addEventListener("click", closeAsk);
for (const [k, id] of Object.entries(DIFF_BTN)) {
  document.getElementById(id).addEventListener("click", () => {
    closeAsk();
    /* 塗りかけ(まだ完成していないのに硝子が入っている)なら、消す前に一度聞く */
    const touched = fills.some(f => f !== null);
    if (touched && !completed) askRedraw(k);
    else newWindow(k);
  });
}

/* ============================================================
   描画:セルをオフスクリーンに焼き込む(変化時のみ)
   ============================================================ */
function cellPath(c, poly) {
  c.beginPath();
  c.moveTo(ux(poly[0][0]), vy(poly[0][1]));
  for (let i = 1; i < poly.length; i++) c.lineTo(ux(poly[i][0]), vy(poly[i][1]));
  c.closePath();
}

/* 外形をコンテキストのパスとして描く(クリップ・木枠用) */
function shapePath(c) {
  c.moveTo(ux(shapePoly[0][0]), vy(shapePoly[0][1]));
  for (let i = 1; i < shapePoly.length; i++) {
    c.lineTo(ux(shapePoly[i][0]), vy(shapePoly[i][1]));
  }
  c.closePath();
}

function redrawGlass() {
  glassCtx.clearRect(0, 0, W, H);
  for (let i = 0; i < cells.length; i++) {
    const poly = cells[i];
    cellPath(glassCtx, poly);
    if (fills[i]) {
      glassCtx.fillStyle = fills[i];
      glassCtx.globalAlpha = 0.92;
      glassCtx.fill();
      let cx = 0, cy = 0;
      for (const p of poly) { cx += ux(p[0]); cy += vy(p[1]); }
      cx /= poly.length; cy /= poly.length;
      const rad = Math.max(8, Math.hypot(ux(poly[0][0]) - cx, vy(poly[0][1]) - cy));
      const g = glassCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, "rgba(255,255,255,0.26)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      glassCtx.fillStyle = g;
      glassCtx.fill();
      glassCtx.globalAlpha = 1;
      glassCtx.strokeStyle = "#17130f";
      glassCtx.lineWidth = 3;
      glassCtx.lineJoin = "round";
      glassCtx.stroke();
    } else {
      glassCtx.fillStyle = "rgba(13,19,32,0.9)";
      glassCtx.globalAlpha = 1;
      glassCtx.fill();
      glassCtx.strokeStyle = "rgba(215,200,170,0.28)";
      glassCtx.lineWidth = 1.2;
      glassCtx.lineJoin = "round";
      glassCtx.stroke();
    }
  }
}

/* ============================================================
   音:Web Audio APIで教会の鐘を合成
   ============================================================ */
let audio = null;
function ensureAudio() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) audio = new AC();
}

function bellStrike(base, when, vol) {
  if (!audio) return;
  const partials = [
    { f: 0.50, g: 0.55, d: 6.0 },   /* ハム(唸りの土台) */
    { f: 1.00, g: 1.00, d: 4.5 },   /* プライム */
    { f: 1.19, g: 0.55, d: 3.2 },   /* ティアス(短三度:鐘特有の哀愁) */
    { f: 1.50, g: 0.35, d: 2.6 },   /* クイント */
    { f: 2.00, g: 0.50, d: 2.2 },   /* ノミナル */
    { f: 2.66, g: 0.18, d: 1.2 },
    { f: 3.98, g: 0.10, d: 0.8 },
  ];
  for (const p of partials) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = base * p.f * (1 + (Math.random() - 0.5) * 0.004);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(p.g * vol, when + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + p.d);
    osc.connect(gain).connect(audio.destination);
    osc.start(when);
    osc.stop(when + p.d + 0.1);
  }
}

function pealBells() {
  ensureAudio();
  if (!audio) return;
  const t0 = audio.currentTime + 0.05;
  const bells = [
    { base: 174.6, interval: 2.1, offset: 0.0, vol: 0.22 },
    { base: 220.0, interval: 1.7, offset: 0.7, vol: 0.17 },
    { base: 261.6, interval: 1.4, offset: 1.3, vol: 0.13 },
  ];
  for (const b of bells) {
    for (let t = b.offset; t < 8.5; t += b.interval) {
      bellStrike(b.base, t0 + t + Math.random() * 0.12, b.vol);
    }
  }
}

/* ============================================================
   タップ音:ワイングラスを爪で軽く弾いたような澄んだ「チン」
   ------------------------------------------------------------
   ・グラスの振動モード(基音の約2.3倍・4.2倍の非整数倍音)を
     サイン波で重ねると、あの硝子特有の透明な響きになる
   ・基音をペンタトニックの高音域から選ぶので、連打しても
     風鈴のように音楽的で耳障りになりにくい
   ・ごく近い音程の2本をわずかにうならせて、余韻に艶を出す
   ============================================================ */
const TING_NOTES = [1568.0, 1760.0, 2093.0, 2349.3, 2637.0];  /* G6 A6 C7 D7 E7 */

let lastTing = 0;
function glassTing() {
  if (!audio) return;
  /* なぞると一度に何枚も嵌まる。重ねすぎると濁るので、鳴らす間隔に下限を置く */
  const now = performance.now();
  if (now - lastTing < 55) return;
  lastTing = now;
  const t = audio.currentTime;
  const base = TING_NOTES[(Math.random() * TING_NOTES.length) | 0];
  const vol = 0.055 + Math.random() * 0.02;   /* 音量もわずかに揺らす */

  /* 硝子の振動モード:比率・強さ・余韻の長さ */
  const modes = [
    { f: 1.000, g: 1.00, d: 0.75 },   /* 基音(いちばん長く残る) */
    { f: 1.004, g: 0.60, d: 0.65 },   /* ごく近い音とのうなり=艶 */
    { f: 2.32,  g: 0.22, d: 0.32 },   /* 第2モード */
    { f: 4.20,  g: 0.07, d: 0.14 },   /* 第3モード(弾いた瞬間の光沢) */
  ];
  for (const m of modes) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = base * m.f;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(m.g * vol, t + 0.004);  /* 爪で弾く立ち上がり */
    gain.gain.exponentialRampToValueAtTime(0.0001, t + m.d);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + m.d + 0.05);
  }
}

/* ============================================================
   入力:セルをタップして色を灯す。はらうと光の帯
   ============================================================ */
const pointer = { down: false, painting: false, x: 0, y: 0 };

const trail = [];
const FLICK_SPEED = 2200;
function pushTrail(x, y) {
  const t = performance.now();
  trail.push({ x, y, t });
  while (trail.length > 0 && t - trail[0].t > 100) trail.shift();
}
let lightSweep = null;

/* 指の下にあるセルの番号。窓の外なら -1 */
function cellAt(x, y) {
  const u = (x - PX) / PW, v = (y - PY) / PH;
  if (u < 0 || u > 1 || v < 0 || v > 1) return -1;
  for (let i = 0; i < cells.length; i++) {
    if (pointInPoly(u, v, cells[i])) return i;
  }
  return -1;
}

/* 持ち主と、その連れに硝子を嵌める。
   defer=true なら描き直しは呼び手に任せる(なぞりで何枚も嵌める時用) */
function fillGroup(h, defer) {
  /* 未記入なら嵌める。既に有れば必ず違う色味に差し替える */
  let c;
  do { c = pickShade(); } while (c === fills[h]);
  for (let k = 0; k < cells.length; k++) {
    if (hosts[k] === h) fills[k] = c;   /* 持ち主と連れは同じ硝子 */
  }
  if (!defer) redrawGlass();
  glassTing();
  glints.push({ idx: h, t: 0, dur: 0.5 });
  updateRemain();
  if (!completed && fills.every(f => f !== null)) {
    completed = true;
    pealBells();
    saveNow();
  } else {
    saveSoon();
  }
}

/* 押す:空いていれば嵌める。嵌まっていれば色味を差し替える */
function tapCell(x, y) {
  const i = cellAt(x, y);
  if (i >= 0) fillGroup(hosts[i]);
}

/* ============================================================
   なぞり塗り
   ------------------------------------------------------------
   ・ひと続きのなぞりで、同じセルは一度だけ
   ・空いているセルだけ嵌める。すでに嵌まっている物は塗り替えない
     (うっかり指をすべらせても、塗った物は壊れない。塗り替えは押して行う)
   ・指の動きは飛び飛びで届くので、前の点との間を細かく埋めて拾う
   ============================================================ */
const strokeDone = new Set();   /* このなぞりで、もう触ったセルの持ち主 */

function paintAt(x, y) {
  const i = cellAt(x, y);
  if (i < 0) return false;
  const h = hosts[i];
  if (strokeDone.has(h)) return false;
  strokeDone.add(h);
  if (fills[h] !== null) return false;
  fillGroup(h, true);   /* 描き直しは、なぞり終わりにまとめて一度 */
  return true;
}

function paintAlong(x0, y0, x1, y1) {
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const steps = Math.max(1, Math.ceil(dist / 6));   /* 6px ごとに拾う */
  let painted = false;
  for (let s = 1; s <= steps; s++) {
    if (paintAt(x0 + (x1 - x0) * s / steps, y0 + (y1 - y0) * s / steps)) painted = true;
  }
  if (painted) redrawGlass();   /* 一度にまとめて描き直す */
  return painted;
}

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  ensureAudio();
  pointer.down = true;
  /* 窓の中から始めたら「なぞり塗り」。外(暗がり)から始めたら「光のはらい」。
     こうしないと、光を出そうとするたびに硝子が 1 枚嵌まってしまう */
  pointer.painting = cellAt(e.clientX, e.clientY) >= 0;
  pointer.x = e.clientX; pointer.y = e.clientY;
  strokeDone.clear();
  trail.length = 0;
  pushTrail(e.clientX, e.clientY);
  if (pointer.painting) {
    const i = cellAt(e.clientX, e.clientY);
    strokeDone.add(hosts[i]);
    fillGroup(hosts[i]);
  }
});
cv.addEventListener("pointermove", e => {
  e.preventDefault();
  if (!pointer.down) return;
  pushTrail(e.clientX, e.clientY);
  if (pointer.painting) paintAlong(pointer.x, pointer.y, e.clientX, e.clientY);
  pointer.x = e.clientX; pointer.y = e.clientY;
});
function onUp() {
  if (!pointer.down) return;
  pointer.down = false;
  strokeDone.clear();
  if (trail.length >= 2) {
    const a = trail[0], b = trail[trail.length - 1];
    const dtms = b.t - a.t;
    if (dtms > 15) {
      const vx = (b.x - a.x) / dtms * 1000;
      const vy2 = (b.y - a.y) / dtms * 1000;
      const sp = Math.hypot(vx, vy2);
      /* はらいの光は、窓の外から始めた時だけ(塗りと取り合わない) */
      if (sp >= FLICK_SPEED && !pointer.painting) {
        lightSweep = { t: 0, dx: vx / sp, dy: vy2 / sp };
      }
    }
  }
  trail.length = 0;
}
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ============================================================
   きらめき
   ============================================================ */
const glints = [];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let glintTimer = 0;

function updateGlints(dt) {
  glintTimer -= dt;
  if (glintTimer <= 0 && !reduceMotion) {
    const filledIdx = [];
    for (let i = 0; i < fills.length; i++) if (fills[i]) filledIdx.push(i);
    if (filledIdx.length > 0) {
      glintTimer = 0.5 + Math.random() * 0.6;
      glints.push({
        idx: filledIdx[(Math.random() * filledIdx.length) | 0],
        t: 0, dur: 0.9,
      });
    } else {
      glintTimer = 0.5;
    }
  }
  for (let i = glints.length - 1; i >= 0; i--) {
    glints[i].t += dt;
    if (glints[i].t > glints[i].dur) glints.splice(i, 1);
  }
}

/* ============================================================
   背景・木枠・光
   ============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#221d17");
  g.addColorStop(0.55, "#181410");
  g.addColorStop(1, "#0e0b08");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (completeGlow > 0) {
    const gg = ctx.createRadialGradient(W / 2, PY + PH / 2, 0, W / 2, PY + PH / 2, Math.max(W, H));
    gg.addColorStop(0, `rgba(255,235,190,${0.10 * completeGlow})`);
    gg.addColorStop(1, "rgba(255,235,190,0)");
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWoodFrame() {
  /* 外形に沿った木枠:外形パスを太い線で縁取る */
  const b = Math.max(9, PW * 0.05);
  ctx.save();
  ctx.beginPath();
  shapePath(ctx);
  const wg = ctx.createLinearGradient(PX, PY, PX + PW, PY + PH);
  wg.addColorStop(0, "#4a3626");
  wg.addColorStop(0.5, "#33251a");
  wg.addColorStop(1, "#241a12");
  ctx.strokeStyle = wg;
  ctx.lineWidth = b * 2;
  ctx.lineJoin = "round";
  ctx.stroke();
  /* 内側の細い縁と、外側のわずかなハイライト */
  ctx.strokeStyle = "#15100b";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,220,170,0.10)";
  ctx.lineWidth = b * 2 + 2;
  ctx.stroke();
  ctx.restore();
}

function drawCompleteRays(time) {
  if (completeGlow <= 0.01) return;
  const cx = W / 2, cy = PY + PH * 0.4;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  /* 窓の外側だけに光が漏れる(外形を除外してクリップ) */
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  shapePath(ctx);
  ctx.clip("evenodd");
  const N = 7;
  for (let i = 0; i < N; i++) {
    const a = Math.PI * 0.5 + (i - (N - 1) / 2) * 0.16 + Math.sin(time * 0.3 + i) * 0.02;
    const len = Math.max(W, H) * 1.2;
    const x2 = cx + Math.cos(a) * len, y2 = cy + Math.sin(a) * len;
    const lg = ctx.createLinearGradient(cx, cy, x2, y2);
    lg.addColorStop(0, `rgba(255,240,200,${0.06 * completeGlow})`);
    lg.addColorStop(1, "rgba(255,240,200,0)");
    ctx.strokeStyle = lg;
    ctx.lineWidth = PW * (0.10 + (i % 3) * 0.05);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   メインループ
   ============================================================ */
let lastT = performance.now();

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const time = now / 1000;

  updateGlints(dt);
  if (completed && completeGlow < 1) completeGlow = Math.min(completeGlow + dt * 0.4, 1);

  drawBackground();

  /* 硝子本体+呼吸する裏光 */
  ctx.drawImage(glassCv, 0, 0, W, H);
  const breathe = (reduceMotion ? 0.10 : 0.10 + 0.07 * Math.sin(time * 0.9))
                + completeGlow * 0.15;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.max(0, breathe);
  ctx.drawImage(glassCv, 0, 0, W, H);
  ctx.restore();

  /* きらめき */
  if (glints.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const g of glints) {
      if (!cells[g.idx] || !fills[g.idx]) continue;
      const a = Math.sin(g.t / g.dur * Math.PI);
      ctx.globalAlpha = a * 0.35;
      cellPath(ctx, cells[g.idx]);
      ctx.fillStyle = "#fff5dc";
      ctx.fill();
    }
    ctx.restore();
  }

  /* はらいの光の帯(窓の中だけを照らす) */
  if (lightSweep) {
    lightSweep.t += dt;
    const p = lightSweep.t / 0.9;
    if (p >= 1) {
      lightSweep = null;
    } else {
      const d = lightSweep;
      const span = Math.max(W, H) * 1.6;
      const cx = W / 2 + d.dx * span * (p - 0.5);
      const cy = PY + PH / 2 + d.dy * span * (p - 0.5);
      const lg = ctx.createLinearGradient(
        cx - d.dx * PW, cy - d.dy * PW,
        cx + d.dx * PW, cy + d.dy * PW
      );
      const a = Math.sin(p * Math.PI) * 0.22;
      lg.addColorStop(0,   "rgba(255,245,215,0)");
      lg.addColorStop(0.5, `rgba(255,245,215,${a})`);
      lg.addColorStop(1,   "rgba(255,245,215,0)");
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      shapePath(ctx);
      ctx.clip();
      ctx.fillStyle = lg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  drawCompleteRays(time);
  drawWoodFrame();

  requestAnimationFrame(frame);
}

/* ============================================================
   起動:前の窓が残っていれば続きから。無ければ normal の窓から
   ============================================================ */
resize();
if (!restoreSaved()) newWindow("normal");
requestAnimationFrame(frame);

/* ============================================================
   テストからのぞく入口(browser-test.js が使う)
   ============================================================ */
window.__app = {
  /* いまの窓の中身 */
  state: () => ({
    cells, fills, hosts, completed,
    /* 画面の「n left」と同じ数え方(あと何回押せば埋まるか) */
    remain: fills.filter((f, i) => f === null && hosts[i] === i).length,
    remainCells: fills.filter(f => f === null).length,
    panel: { x: PX, y: PY, w: PW, h: PH },
  }),
  /* セルの中心の画面座標(指で押す場所を測るのに使う) */
  cellCenter: (i) => {
    const poly = cells[i];
    let cx = 0, cy = 0;
    for (const p of poly) { cx += ux(p[0]); cy += vy(p[1]); }
    return { x: cx / poly.length, y: cy / poly.length };
  },
  newWindow,
  tapCell,
  paintAlong,
  saveKey: SAVE_KEY,
  sweeping: () => lightSweep !== null,
  asking: () => !document.getElementById("ask").hidden,
  /* 音を鳴らさずに全部埋める(完成時の見た目だけ確かめたい時) */
  fillAll: () => {
    for (let i = 0; i < fills.length; i++) if (!fills[i]) fills[i] = pickShade();
    for (let i = 0; i < fills.length; i++) fills[i] = fills[hosts[i]];   /* 連れは持ち主と同じ硝子 */
    completed = true;
    redrawGlass();
    updateRemain();
  },
};

/* ============================================================
   PWA:Service Worker登録(オフラインでも遊べるように)
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* 登録失敗時も通常のWebページとして動くので何もしない */
    });
  });
}
</script>
